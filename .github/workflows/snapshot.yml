name: Commodity Snapshot Job

on:
  repository_dispatch:
    types: [run-snapshot]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Run Snapshot Task
        env:
          TZ: 'Asia/Tokyo'
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SYSTEM_LOG_WEBHOOK_URL: ${{ secrets.SYSTEM_LOG_WEBHOOK_URL }}
        run: python src/main.py --mode snapshot

      - name: Commit and Push State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if ! git diff --staged --quiet; then
            git commit -m "Chore: Update snapshot state [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
