name: Commodity Bot Runner

on:
  workflow_dispatch: # cron-job.org 等からのWebhook起動、またはブラウザ上の手動実行ボタン

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Bot Task
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        REPORT_CHANNEL_ID: ${{ secrets.REPORT_CHANNEL_ID }}
        ALERT_CHANNEL_ID: ${{ secrets.ALERT_CHANNEL_ID }}
        OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
        OANDA_ENV: ${{ secrets.OANDA_ENV }}
      run: |
        python src/main.py

    # データの変更（state.jsonの更新/リセット）があれば自動コミット＆プッシュ
    - name: Commit and Push Updated State
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/state.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update market state data [skip ci]" && git push)
