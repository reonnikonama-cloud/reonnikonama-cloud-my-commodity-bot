name: Commodity Daily Report Job

on:
  repository_dispatch:
    types: [run-daily-report]
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Run Daily Report Task
        env:
          TZ: 'Asia/Tokyo'
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
          SYSTEM_LOG_WEBHOOK_URL: ${{ secrets.SYSTEM_LOG_WEBHOOK_URL }}
        run: python -m src.main --mode daily_report

      - name: Commit and Push Cleared State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if ! git diff --staged --quiet; then
            git commit -m "Chore: Reset state for next day [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Commit and Push Cleared State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: Reset state for next day [skip ci]" && git push)
