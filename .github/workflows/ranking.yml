name: Commodity Ranking Job

on:
  repository_dispatch:
    types: [run-ranking]
  workflow_dispatch:

jobs:
  ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Run Ranking Task
        env:
          TZ: 'Asia/Tokyo'
          RANKING_WEBHOOK_URL: ${{ secrets.RANKING_WEBHOOK_URL }}
          SYSTEM_LOG_WEBHOOK_URL: ${{ secrets.SYSTEM_LOG_WEBHOOK_URL }}
        run: python -m src.main --mode ranking
