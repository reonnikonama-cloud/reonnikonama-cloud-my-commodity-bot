name: Commodity Ranking Job

on:
  repository_dispatch:
    types: [run-ranking]
  workflow_dispatch:

jobs:
  ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance discord.py python-dotenv

      - name: Run Ranking Task
        env:
          RANKING_WEBHOOK_URL: ${{ secrets.RANKING_WEBHOOK_URL }}
          SYSTEM_LOG_WEBHOOK_URL: ${{ secrets.SYSTEM_LOG_WEBHOOK_URL }}
        run: python src/main.py --mode ranking
